name: Build Push and Deploy to kubernetes

on:
    push:
        branches:
            - main

jobs:
    deploy:
        runs-on: ubuntu-latest

        steps:
            - name: checkout source code
              uses: actions/checkout@v4

            - name: log in to Docker Hub
              run: echo "${{ secrets.DOCKERHUB_PASSWORD }}" | docker login -u "${{ secrets.DOCKERHUB_USER }}" --password-stdin
              
            - name: Build Docker Image
              run: docker build -t ${{ secrets.DOCKERHUB_USER }}/myapp:v4 .
              
            - name: Push Docker Image
              run: docker push ${{ secrets.DOCKERHUB_USER }}/myapp:v4

            # Setup the kubeconfig and will change it

            - name: Set up kubeconfig
              run: |
                mkdir -p $HOME/.kube
                echo "${{ secrets.KUBE_CONFIG }}" | base64 -d > $HOME/.kube/config
                chmod 600 $HOME/.kube/config

            - name: verify cluster access
              run: kubectl get nodes

            - name: Update the kubernetes deployement image
              run: kubectl set image deployment/myapp-deployment myapp=${{ secrets.DOCKERHUB_USER }}/myapp:v4

            - name: check rollout status
              run: kubectl rollout status deployment/myapp-deployment --timeout=120s